name: Research Bot (Morning Scan)

on:
  push:
    branches: [main]
  schedule:
    # Run 1: before market open — 8:30 AM EDT / 9:30 AM ADT = 12:30 UTC
    - cron: '30 12 * * 1-5'
    # Run 2: market close — 4:00 PM EDT / 5:00 PM ADT = 20:00 UTC
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Research
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_FALLBACK: ${{ secrets.GOOGLE_API_KEY_FALLBACK }}
          RESEARCH_GEMINI_KEY: ${{ secrets.RESEARCH_GEMINI_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          VITE_ALPACA_API_KEY: ${{ secrets.VITE_ALPACA_API_KEY }}
          VITE_ALPACA_SECRET_KEY: ${{ secrets.VITE_ALPACA_SECRET_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        timeout-minutes: 15
        run: |
          cd backend
          echo "Running RESEARCH..."
          python run_research.py
          echo "Running OVERNIGHT ANALYSIS..."
          python run_overnight.py

      - name: Sync and Push Results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          # Sync backend results
          cp backend/reports.json ./reports.json || true
          cp backend/reports.json frontend/public/reports.json || true
          cp backend/app_state.json ./app_state.json || true
          cp backend/app_state.json frontend/public/app_state.json || true
          cp backend/longterm_picks.json ./longterm_picks.json || true
          cp backend/longterm_picks.json frontend/public/longterm_picks.json || true
          cp backend/overnight_analysis.json ./overnight_analysis.json || true
          cp backend/overnight_analysis.json frontend/public/overnight_analysis.json || true

          git add backend/*.json
          git add frontend/public/*.json
          git add *.json

          git commit -m "Automated Research Sync: $(date)" || echo "No changes to commit"
          # Pull with rebase to avoid conflicts if another workflow pushed first
          git pull --rebase origin main || true
          git push origin main