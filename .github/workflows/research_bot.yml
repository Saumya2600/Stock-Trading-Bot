name: Research Bot (Pre-open + Close)

on:
  schedule:
    # Cron is fixed UTC, the market is not. These two slots land inside the
    # right hours in both DST seasons:
    #   13:00 UTC = 09:00 ET (EDT) / 08:00 ET (EST) → pre-open both ways
    #   21:15 UTC = 17:15 ET (EDT) / 16:15 ET (EST) → after the close both ways
    # Off the hour on purpose: GitHub's scheduler is most congested at :00 and
    # can delay those runs by 15+ minutes.
    - cron: '7 13 * * 1-5'
    - cron: '19 21 * * 1-5'
  workflow_dispatch:
    inputs:
      # An external scheduler (cron-job.org) dispatches this same workflow, so a
      # manual run stays guarded unless you explicitly ask for a full re-grade.
      force:
        description: 'Ignore the 3-hour "already ran" guard'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Research and trading both update shared JSON snapshots on main.
  group: stock-bot-data-sync
  cancel-in-progress: false

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Research
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_FALLBACK: ${{ secrets.GOOGLE_API_KEY_FALLBACK }}
          RESEARCH_GEMINI_KEY: ${{ secrets.RESEARCH_GEMINI_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          VITE_ALPACA_API_KEY: ${{ secrets.VITE_ALPACA_API_KEY }}
          VITE_ALPACA_SECRET_KEY: ${{ secrets.VITE_ALPACA_SECRET_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RESEARCH_FORCE: ${{ inputs.force }}
        timeout-minutes: 15
        run: |
          cd backend
          echo "Running RESEARCH..."
          python run_research.py
          echo "Running OVERNIGHT ANALYSIS..."
          python run_overnight.py
          # Free Yahoo data, no model calls — keeps Canadian coverage off the
          # Gemini quota entirely.
          echo "Running CANADA SNAPSHOT..."
          python run_canada.py || echo "Canada snapshot skipped"

      - name: Sync and Push Results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          # Sync backend results
          cp backend/reports.json ./reports.json || true
          cp backend/reports.json frontend/public/reports.json || true
          cp backend/app_state.json ./app_state.json || true
          cp backend/app_state.json frontend/public/app_state.json || true
          cp backend/longterm_picks.json ./longterm_picks.json || true
          cp backend/longterm_picks.json frontend/public/longterm_picks.json || true
          cp overnight_analysis.json frontend/public/overnight_analysis.json || true
          cp canada.json frontend/public/canada.json || true

          git add backend/*.json
          git add frontend/public/*.json
          git add *.json

          git commit -m "Automated Research Sync: $(date)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main