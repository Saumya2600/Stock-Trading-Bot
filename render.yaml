services:
  - type: web
    name: stock-trading-bot
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VITE_ALPACA_API_KEY
        sync: false
      - key: VITE_ALPACA_SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_FALLBACK
        sync: false
      - key: fmp
        sync: false
      - key: FINNHUB_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
  - type: cron
    name: stock-trading-bot-pre-market
    runtime: python
    schedule: "30 12 * * 1-5"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run_render_premarket.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RESEARCH_WEB_URL
        value: https://stock-trading-bot.onrender.com
