services:
  - type: web
    name: stock-trading-bot
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VITE_ALPACA_API_KEY
        sync: false
      - key: VITE_ALPACA_SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_FALLBACK
        sync: false
      - key: fmp
        sync: false
      - key: FINNHUB_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
